<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modulo12</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --bg-color: #050508; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: monospace; user-select: none; color: #fff;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #debug-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.85); padding: 15px;
            border-radius: 8px; pointer-events: none; border: 1px solid #333;
            z-index: 10; min-width: 250px;
        }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.95); display: flex; justify-content: center;
            align-items: center; z-index: 20; flex-direction: column;
        }
        button {
            background-color: #00ff00; color: #000; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); transition: all 0.2s;
            font-family: monospace;
        }
        button:hover { background-color: #00cc00; transform: scale(1.05); }
        button:disabled { background-color: #555; box-shadow: none; cursor: not-allowed; color: #aaa; }
        
        .history-track {
            color: #888; font-size: 11px; margin-top: 10px;
            border-top: 1px solid #333; padding-top: 10px;
        }

        #menu-btn {
            position: absolute; top: 20px; right: 20px; z-index: 30;
            font-size: 32px; color: #fff; cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #sidebar {
            position: fixed; top: 0; right: -280px; width: 240px; height: 100%;
            background: rgba(10, 10, 12, 0.98); border-left: 1px solid #333;
            transition: right 0.3s ease; z-index: 40; padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.8);
        }
        #sidebar.active { right: 0; }
        #close-btn {
            font-size: 32px; cursor: pointer; text-align: right; 
            margin-bottom: 20px; color: #888;
        }
        #close-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="menu-btn">☰</div>
    <div id="sidebar">
        <div id="close-btn">×</div>
        <h3 style="color: #00ff00; margin-top: 0;">Modulo12</h3>
        <hr style="border-color: #333;">
        <div style="color: #888; font-size: 13px; margin-top: 20px; line-height: 2;">
            <p>▶ Selector de Escalas (Próximamente)</p>
            <p>▶ Ajustes de Sensibilidad (Próximamente)</p>
            <p>▶ Exportar Historial (Próximamente)</p>
        </div>
    </div>

    <div id="overlay">
        <h1 style="margin-bottom: 30px; color: #00ff00; letter-spacing: 2px;">Modulo12</h1>
        <button id="start-btn">Iniciar</button>
    </div>

    <div id="debug-panel">Inicializando Matriz Radial...</div>
    <canvas id="harmonyCanvas"></canvas>

    <script>
        // ==========================================
        // 1. CONSTANTES Y DICCIONARIO
        // ==========================================
        const noteNames = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const Z12_DICTIONARY = [];
        const createMask = (notes) => notes.reduce((m, n) => m | (1 << n), 0);

        for(let i=0; i<12; i++) {
            Z12_DICTIONARY.push({ name: `${noteNames[i]} May`, mask: createMask([i, (i+4)%12, (i+7)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]} min`, mask: createMask([i, (i+3)%12, (i+7)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}Maj7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+11)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}min7`, mask: createMask([i, (i+3)%12, (i+7)%12, (i+10)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+10)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}dim7`, mask: createMask([i, (i+3)%12, (i+6)%12, (i+9)%12]) });
        }

        // ==========================================
        // 2. MOTOR LÓGICO
        // ==========================================
        const HarmonyEngine = {
            createPitchClassSet: createMask,
            calculateParsimony: (maskA, maskB) => {
                let intersection = maskA & maskB; let count = 0;
                while (intersection > 0) { count += intersection & 1; intersection >>= 1; }
                return count;
            },
            evaluateTension: (notesArray) => {
                if (notesArray.length < 2) return { level: 0.0, color: {r: 0, g: 255, b: 0}, desc: "Reposo absoluto" };
                let hasTritone = false, hasMinorSecond = false;
                for (let i=0; i<notesArray.length; i++) {
                    for (let j=i+1; j<notesArray.length; j++) {
                        let interval = Math.abs(notesArray[i] - notesArray[j]) % 12;
                        if (interval === 6) hasTritone = true;
                        if (interval === 1 || interval === 11) hasMinorSecond = true;
                    }
                }
                if (hasTritone) return { level: 1.0, color: {r: 255, g: 0, b: 0}, desc: "Máxima inestabilidad" };
                if (hasMinorSecond) return { level: 0.7, color: {r: 255, g: 165, b: 0}, desc: "Tensión creciente" };
                return { level: 0.3, color: {r: 0, g: 255, b: 255}, desc: "Estabilidad matizada" };
            },
            suggestNextPath: (currentMask) => {
                if(currentMask === 0) return null;
                let bestSuggestion = null; let maxShared = -1;
                for(const chord of Z12_DICTIONARY) {
                    if(chord.mask === currentMask) continue; 
                    let shared = HarmonyEngine.calculateParsimony(currentMask, chord.mask);
                    if(shared > maxShared) { maxShared = shared; bestSuggestion = chord; }
                }
                return maxShared > 0 ? bestSuggestion : null;
            }
        };

        // ==========================================
        // 3. GESTOR DE ESTADO
        // ==========================================
        const INITIAL_MATRIX = {
            "current_state": {
                "active_mask": 0, "notes_array": [], "notes_detail": [], 
                "tension_level": 0.0, "color": {"r": 34, "g": 34, "b": 34},
                "description": "Silencio", "suggestion": null, "history": []
            }
        };

        class StateManager {
            constructor(initialMatrix) {
                const savedState = localStorage.getItem('modulus_z12_state');
                this.state = savedState ? JSON.parse(savedState) : JSON.parse(JSON.stringify(initialMatrix.current_state));
                this.listeners = [];
            }
            updateState(newStateMatrix) {
                if (this.state.active_mask !== newStateMatrix.active_mask) {
                    let currentHistory = this.state.history || [];
                    if (newStateMatrix.active_mask > 0) {
                        const chordDef = Z12_DICTIONARY.find(c => c.mask === newStateMatrix.active_mask);
                        const chordName = chordDef ? chordDef.name : `Set [${newStateMatrix.notes_detail.map(n=>n.name).join(',')}]`;
                        const lastEntry = currentHistory[currentHistory.length - 1];
                        
                        if (!lastEntry || lastEntry.mask !== newStateMatrix.active_mask) {
                            currentHistory.push({ mask: newStateMatrix.active_mask, name: chordName });
                            if (currentHistory.length > 5) currentHistory.shift();
                        }
                    }
                    this.state = { ...this.state, ...newStateMatrix, history: currentHistory };
                    localStorage.setItem('modulus_z12_state', JSON.stringify(this.state));
                    this.notify();
                }
            }
            subscribe(callback) { this.listeners.push(callback); this.notify(); }
            notify() {
                const stateSnapshot = JSON.parse(JSON.stringify(this.state));
                this.listeners.forEach(listener => listener(stateSnapshot));
            }
        }

        // ==========================================
        // 4. MÓDULO ACÚSTICO (CORREGIDO Y PRECISO)
        // ==========================================
        class AudioSentry {
            constructor(stateManager) {
                this.stateManager = stateManager;
                this.audioContext = null; this.analyser = null;
                this.dataArray = null; this.isListening = false;
                this.AMPLITUDE_THRESHOLD = -48; // Umbral óptimo de sensibilidad en dB
            }

            async initialize() {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        alert("El navegador requiere conexión HTTPS segura.");
                        return false;
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.audioContext = new AudioCtx();
                    
                    if (this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }

                    const source = this.audioContext.createMediaStreamSource(stream);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 4096; // Alta resolución espectral
                    this.analyser.smoothingTimeConstant = 0.5; // Menor inercia para refresco inmediato
                    source.connect(this.analyser);
                    
                    this.dataArray = new Float32Array(this.analyser.frequencyBinCount);
                    this.isListening = true;
                    this.listenLoop();
                    
                    return true;
                } catch (error) { 
                    console.error("Error micrófono:", error);
                    alert("Permiso denegado o hardware ocupado."); 
                    return false;
                }
            }

            listenLoop() {
                if (!this.isListening) return;
                this.analyser.getFloatFrequencyData(this.dataArray);
                
                const notesDetail = this.extractDetailedPitches(); 
                const rawPitches = notesDetail.map(n => n.pitch);
                const currentMask = HarmonyEngine.createPitchClassSet(rawPitches);
                
                const tensionData = HarmonyEngine.evaluateTension(rawPitches);
                const suggestedPath = HarmonyEngine.suggestNextPath(currentMask);

                this.stateManager.updateState({
                    active_mask: currentMask,
                    notes_array: rawPitches,
                    notes_detail: notesDetail, 
                    tension_level: tensionData.level,
                    color: tensionData.color,
                    description: tensionData.desc,
                    suggestion: suggestedPath
                });

                requestAnimationFrame(() => this.listenLoop());
            }

            extractDetailedPitches() {
                const sampleRate = this.audioContext.sampleRate;
                const binCount = this.analyser.frequencyBinCount;
                let detected = [];

                for (let i = 2; i < binCount - 2; i++) {
                    const amplitude = this.dataArray[i];
                    
                    // Selección estricta de picos espectrales locales locales para evitar armónicos falsos
                    if (amplitude > this.AMPLITUDE_THRESHOLD) {
                        if (amplitude > this.dataArray[i-1] && amplitude > this.dataArray[i+1]) {
                            const frequency = i * (sampleRate / (binCount * 2));
                            
                            // Filtrado estricto del rango musical fundamental (A1 a C7)
                            if (frequency < 55 || frequency > 2100) continue;
                            
                            const midiNote = Math.round(12 * Math.log2(frequency / 440) + 69);
                            const pitchClass = ((midiNote % 12) + 12) % 12;
                            const octave = Math.floor(midiNote / 12) - 1;
                            
                            detected.push({
                                pitch: pitchClass,
                                octave: octave,
                                midi: midiNote,
                                amplitude: amplitude,
                                name: `${noteNames[pitchClass]}${octave}`
                            });
                        }
                    }
                }
                
                // Agrupar por clase de tono, conservando la octava con mayor energía (pico real)
                let uniqueMap = new Map();
                detected.forEach(d => {
                    if(!uniqueMap.has(d.pitch) || uniqueMap.get(d.pitch).amplitude < d.amplitude) {
                        uniqueMap.set(d.pitch, d);
                    }
                });
                
                // Ordenar por frecuencia (El índice 0 se convierte en la raíz del Sistema Solar)
                return Array.from(uniqueMap.values()).sort((a, b) => a.midi - b.midi);
            }
        }

        // ==========================================
        // 5. PROYECTOR VISUAL
        // ==========================================
        class VisualRenderer {
            constructor(canvasId, stateManager) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.stateManager = stateManager;
                this.stateManager.subscribe((state) => this.render(state));
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.render(this.stateManager.state);
            }

            drawOrbitRing(centerX, centerY, radius, isDashed = false, opacity = 0.1) {
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                this.ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                this.ctx.lineWidth = 1;
                if(isDashed) this.ctx.setLineDash([4, 8]);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            }

            drawNode(name, x, y, size, color, isTextDark = true, shadowBlur = 0, strokeColor = '#333') {
                this.ctx.beginPath();
                this.ctx.arc(x, y, size, 0, Math.PI * 2);
                this.ctx.fillStyle = color;
                this.ctx.shadowBlur = shadowBlur;
                this.ctx.shadowColor = color;
                this.ctx.fill();
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = strokeColor;
                this.ctx.stroke();

                this.ctx.fillStyle = isTextDark ? '#000' : '#fff';
                let fontSize = name.length > 2 ? size * 0.5 : size * 0.65;
                this.ctx.font = `bold ${fontSize}px monospace`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.shadowBlur = 0; 
                this.ctx.fillText(name, x, y);
            }

            render(state) {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const { active_mask, notes_detail, color, suggestion } = state;
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                const minDimension = Math.min(this.canvas.width, this.canvas.height);
                const orbit1Radius = minDimension * 0.20; 
                const orbit2Radius = minDimension * 0.35; 
                const orbit3Radius = minDimension * 0.45; 

                this.drawOrbitRing(centerX, centerY, orbit1Radius, false, 0.15);
                this.drawOrbitRing(centerX, centerY, orbit2Radius, true, 0.2);
                this.drawOrbitRing(centerX, centerY, orbit3Radius, false, 0.05);

                const colorStr = `rgb(${color.r}, ${color.g}, ${color.b})`;
                
                if (active_mask === 0) {
                    for(let i=0; i<12; i++) {
                        const angle = (i * Math.PI * 2) / 12 - (Math.PI / 2);
                        const x = centerX + Math.cos(angle) * orbit3Radius;
                        const y = centerY + Math.sin(angle) * orbit3Radius;
                        this.drawNode(noteNames[i], x, y, 12, '#0f0f12', false, 0, '#222');
                    }
                    return;
                }

                // El Sol (Nota más grave)
                const rootNode = notes_detail[0];
                const rootPitch = rootNode.pitch;
                this.drawNode(rootNode.name, centerX, centerY, 38, colorStr, true, 40, '#fff');

                const planets = [];     
                const moons = [];       
                const deepSpace = [];   

                for(let i=0; i<12; i++) {
                    if (i === rootPitch) continue; 
                    
                    if ((active_mask & (1 << i)) !== 0) {
                        const detail = notes_detail.find(n => n.pitch === i);
                        planets.push(detail ? detail : { pitch: i, name: noteNames[i] });
                    } 
                    else if (suggestion && (suggestion.mask & (1 << i)) !== 0) {
                        moons.push({ pitch: i, name: noteNames[i] });
                    } 
                    else {
                        deepSpace.push({ pitch: i, name: noteNames[i] });
                    }
                }

                const distribute = (nodesArray, radius, nodeSize, nodeColor, textDark, blur, stroke) => {
                    const count = nodesArray.length;
                    nodesArray.forEach((nodeObj, index) => {
                        const angle = (index * Math.PI * 2) / count - (Math.PI / 2);
                        const x = centerX + Math.cos(angle) * radius;
                        const y = centerY + Math.sin(angle) * radius;
                        
                        if(radius === orbit1Radius) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(centerX, centerY);
                            this.ctx.lineTo(x, y);
                            this.ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`;
                            this.ctx.lineWidth = 2;
                            this.ctx.stroke();
                        }
                        
                        this.drawNode(nodeObj.name, x, y, nodeSize, nodeColor, textDark, blur, stroke);
                    });
                };

                if (planets.length > 0) distribute(planets, orbit1Radius, 24, colorStr, true, 20, '#fff');
                if (moons.length > 0) distribute(moons, orbit2Radius, 18, 'rgba(255,255,255,0.15)', false, 10, '#aaa');
                if (deepSpace.length > 0) distribute(deepSpace, orbit3Radius, 10, '#0f0f12', false, 0, '#222');
            }
        }

        // ==========================================
        // 6. CONTROLADORES DE INTERFAZ
        // ==========================================
        const stateManager = new StateManager(INITIAL_MATRIX);
        const renderer = new VisualRenderer('harmonyCanvas', stateManager);
        const audioSentry = new AudioSentry(stateManager);
        
        const debugPanel = document.getElementById('debug-panel');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');

        menuBtn.addEventListener('click', () => sidebar.classList.add('active'));
        closeBtn.addEventListener('click', () => sidebar.classList.remove('active'));

        stateManager.subscribe((state) => {
            const sugText = state.suggestion ? `<span style="color: #fff">Ruta: ${state.suggestion.name}</span>` : 'Ninguna';
            const historyText = state.history && state.history.length > 0 
                ? state.history.map(h => h.name).join(' ➔ ') 
                : 'Esperando eventos...';

            const detailNames = state.notes_detail.map(n => n.name).join(', ');

            debugPanel.innerHTML = `
                <strong style="color: #00ff00;">MODULO12: ACTIVO</strong><br><br>
                Nodos: [${detailNames || 'Ninguno'}]<br>
                Tensión: ${state.tension_level.toFixed(1)}<br>
                Estado: <span style="color: rgb(${state.color.r},${state.color.g},${state.color.b})">${state.description}</span><br><br>
                ${sugText}
                <div class="history-track">
                    <strong>Registro de Sesión:</strong><br>
                    ${historyText}
                </div>
            `;
        });

        startBtn.addEventListener('click', async () => {
            startBtn.textContent = "Conectando...";
            startBtn.disabled = true;
            
            const initSuccess = await audioSentry.initialize();
            
            if (initSuccess) {
                overlay.style.display = 'none';
            } else {
                startBtn.textContent = "Iniciar";
                startBtn.disabled = false;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(e => console.error(e));
            });
        }
    </script>
</body>
</html>
