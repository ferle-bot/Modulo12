<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modulus (PWA) - Motor Local-First</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0a0a0c;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            user-select: none;
            color: #fff;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #debug-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #333;
            z-index: 10;
            min-width: 250px;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
        }
        button {
            background-color: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            transition: all 0.2s;
        }
        button:hover {
            background-color: #00cc00;
            transform: scale(1.05);
        }
        .history-track {
            color: #888;
            font-size: 11px;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 20px;">Modulus: Persistencia Z12</h2>
        <button id="start-btn">Inicializar Motor Acústico</button>
    </div>

    <div id="debug-panel">Cargando Memoria...</div>
    <canvas id="harmonyCanvas"></canvas>

    <script>
        // ==========================================
        // 1. DICCIONARIO ARMÓNICO (Tríadas y Tétradas)
        // ==========================================
        const Z12_DICTIONARY = [];
        const noteNames = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        
        const createMask = (notes) => notes.reduce((m, n) => m | (1 << n), 0);

        for(let i=0; i<12; i++) {
            Z12_DICTIONARY.push({ name: `${noteNames[i]} May`, mask: createMask([i, (i+4)%12, (i+7)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]} min`, mask: createMask([i, (i+3)%12, (i+7)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}Maj7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+11)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}min7`, mask: createMask([i, (i+3)%12, (i+7)%12, (i+10)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+10)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}dim7`, mask: createMask([i, (i+3)%12, (i+6)%12, (i+9)%12]) });
            Z12_DICTIONARY.push({ name: `${noteNames[i]}m7b5`, mask: createMask([i, (i+3)%12, (i+6)%12, (i+10)%12]) });
        }

        // ==========================================
        // 2. MOTOR MATEMÁTICO Z12
        // ==========================================
        const HarmonyEngine = {
            createPitchClassSet: createMask,
            
            calculateParsimony: (maskA, maskB) => {
                let intersection = maskA & maskB;
                let count = 0;
                while (intersection > 0) { count += intersection & 1; intersection >>= 1; }
                return count;
            },

            evaluateTension: (notesArray) => {
                if (notesArray.length < 2) return { level: 0.0, color: {r: 0, g: 255, b: 0}, desc: "Reposo / Aislada" };
                let hasTritone = false, hasMinorSecond = false;
                for (let i = 0; i < notesArray.length; i++) {
                    for (let j = i + 1; j < notesArray.length; j++) {
                        let interval = Math.abs(notesArray[i] - notesArray[j]) % 12;
                        if (interval === 6) hasTritone = true;
                        if (interval === 1 || interval === 11) hasMinorSecond = true;
                    }
                }
                if (hasTritone) return { level: 1.0, color: {r: 255, g: 0, b: 0}, desc: "Máxima inestabilidad (Tritono)" };
                if (hasMinorSecond) return { level: 0.7, color: {r: 255, g: 165, b: 0}, desc: "Tensión (2da menor)" };
                return { level: 0.3, color: {r: 0, g: 255, b: 255}, desc: "Estabilidad matizada" };
            },

            suggestNextPath: (currentMask) => {
                if(currentMask === 0) return null;
                let bestSuggestion = null;
                let maxSharedTones = -1;

                for(const chord of Z12_DICTIONARY) {
                    if(chord.mask === currentMask) continue; 
                    let shared = HarmonyEngine.calculateParsimony(currentMask, chord.mask);
                    if(shared > maxSharedTones) {
                        maxSharedTones = shared;
                        bestSuggestion = chord;
                    }
                }
                return maxSharedTones > 0 ? bestSuggestion : null;
            }
        };

        // ==========================================
        // 3. MATRIZ BASE JSON
        // ==========================================
        const INITIAL_MATRIX = {
            "current_state": {
                "active_mask": 0,
                "notes_array": [],
                "tension_level": 0.0,
                "color": {"r": 34, "g": 34, "b": 34},
                "description": "Silencio",
                "suggestion": null,
                "history": []
            }
        };

        // ==========================================
        // 4. GESTOR DE ESTADO CON PERSISTENCIA
        // ==========================================
        class StateManager {
            constructor(initialMatrix) {
                // Recuperar estado desde localStorage si existe (Local-First estricto)
                const savedState = localStorage.getItem('modulus_z12_state');
                if (savedState) {
                    this.state = JSON.parse(savedState);
                } else {
                    this.state = JSON.parse(JSON.stringify(initialMatrix.current_state));
                }
                this.listeners = [];
            }

            updateState(newStateMatrix) {
                if (this.state.active_mask !== newStateMatrix.active_mask) {
                    
                    let currentHistory = this.state.history || [];
                    
                    // Solo registrar en el historial si es un acorde detectado (no silencio)
                    if (newStateMatrix.active_mask > 0) {
                        const chordDef = Z12_DICTIONARY.find(c => c.mask === newStateMatrix.active_mask);
                        const chordName = chordDef ? chordDef.name : `[${newStateMatrix.notes_array.join(',')}]`;
                        
                        const lastEntry = currentHistory[currentHistory.length - 1];
                        
                        // Evitar registrar el mismo acorde consecutivamente
                        if (!lastEntry || lastEntry.mask !== newStateMatrix.active_mask) {
                            currentHistory.push({ mask: newStateMatrix.active_mask, name: chordName });
                            if (currentHistory.length > 5) currentHistory.shift(); // Mantener buffer de 5
                        }
                    }

                    this.state = { ...this.state, ...newStateMatrix, history: currentHistory };
                    
                    // Persistir matriz en texto plano al almacenamiento local
                    localStorage.setItem('modulus_z12_state', JSON.stringify(this.state));
                    
                    this.notify();
                }
            }

            subscribe(callback) {
                this.listeners.push(callback);
                this.notify(); 
            }

            notify() {
                const stateSnapshot = JSON.parse(JSON.stringify(this.state));
                this.listeners.forEach(listener => listener(stateSnapshot));
            }
        }

        // ==========================================
        // 5. MÓDULO DE PERCEPCIÓN ACÚSTICA (HPS FILTER)
        // ==========================================
        class AudioSentry {
            constructor(stateManager) {
                this.stateManager = stateManager;
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.isListening = false;
            }

            async initialize() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = this.audioContext.createMediaStreamSource(stream);
                    
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 4096;
                    this.analyser.smoothingTimeConstant = 0.85;
                    
                    source.connect(this.analyser);
                    this.dataArray = new Float32Array(this.analyser.frequencyBinCount);
                    this.isListening = true;
                    
                    this.listenLoop();
                } catch (error) {
                    alert("Error: No se pudo acceder al micrófono.");
                    console.error(error);
                }
            }

            listenLoop() {
                if (!this.isListening) return;

                this.analyser.getFloatFrequencyData(this.dataArray);
                const detectedNotes = this.extractPitchClasses();
                const currentMask = HarmonyEngine.createPitchClassSet(detectedNotes);
                
                const tensionData = HarmonyEngine.evaluateTension(detectedNotes);
                const suggestedPath = HarmonyEngine.suggestNextPath(currentMask);

                this.stateManager.updateState({
                    active_mask: currentMask,
                    notes_array: detectedNotes,
                    tension_level: tensionData.level,
                    color: tensionData.color,
                    description: tensionData.desc,
                    suggestion: suggestedPath
                });

                requestAnimationFrame(() => this.listenLoop());
            }

            extractPitchClasses() {
                const sampleRate = this.audioContext.sampleRate;
                const binCount = this.analyser.frequencyBinCount;
                
                const linearData = new Float32Array(binCount);
                for(let i = 0; i < binCount; i++) {
                    linearData[i] = Math.pow(10, this.dataArray[i] / 20);
                }

                const HPS_ORDER = 3; 
                const hpsLength = Math.floor(binCount / HPS_ORDER);
                const hps = new Float32Array(hpsLength);
                let maxHps = 0;

                for(let i = 0; i < hpsLength; i++) {
                    let product = linearData[i] * linearData[i * 2] * linearData[i * 3];
                    hps[i] = product;
                    if(product > maxHps) maxHps = product;
                }

                let activePitchClasses = new Set();
                const ABSOLUTE_NOISE_FLOOR = Math.pow(Math.pow(10, -50 / 20), HPS_ORDER); 
                const RELATIVE_THRESHOLD = 0.15;

                if (maxHps > ABSOLUTE_NOISE_FLOOR) {
                    for (let i = 0; i < hps.length; i++) {
                        if (hps[i] > (maxHps * RELATIVE_THRESHOLD)) {
                            const frequency = i * (sampleRate / (binCount * 2));
                            if (frequency < 65 || frequency > 2000) continue;
                            const midiNote = Math.round(12 * Math.log2(frequency / 440) + 69);
                            const pitchClass = ((midiNote % 12) + 12) % 12;
                            activePitchClasses.add(pitchClass);
                        }
                    }
                }
                
                return Array.from(activePitchClasses).sort((a, b) => a - b);
            }
        }

        // ==========================================
        // 6. PROYECTOR VISUAL (GEOMETRÍA TONNETZ)
        // ==========================================
        class VisualRenderer {
            constructor(canvasId, stateManager) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.stateManager = stateManager;
                this.stateManager.subscribe((state) => this.render(state));
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.render(this.stateManager.state);
            }

            getCoords(index, centerX, centerY, scale) {
                const tonnetzMap = {
                    5:  {x: -1,   y: 0},     // F
                    0:  {x: 0,    y: 0},     // C
                    7:  {x: 1,    y: 0},     // G
                    2:  {x: 2,    y: 0},     // D
                    9:  {x: 3,    y: 0},     // A
                    8:  {x: -0.5, y: -1},    // Ab
                    3:  {x: 0.5,  y: -1},    // Eb
                    10: {x: 1.5,  y: -1},    // Bb
                    4:  {x: 0.5,  y: 1},     // E
                    11: {x: 1.5,  y: 1},     // B
                    6:  {x: 2.5,  y: 1},     // F#
                    1:  {x: 3.5,  y: 1}      // Db
                };
                
                const mapX = tonnetzMap[index].x - 1.2; 
                const mapY = tonnetzMap[index].y;

                return {
                    x: centerX + (mapX * scale),
                    y: centerY - (mapY * scale * 0.866) 
                };
            }

            render(state) {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const { active_mask, color, suggestion } = state;
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const scale = Math.min(this.canvas.width, this.canvas.height) * 0.25;

                // Malla Base
                this.ctx.strokeStyle = '#1a1a1c';
                this.ctx.lineWidth = 2;
                for (let i = 0; i < 12; i++) {
                    const pos1 = this.getCoords(i, centerX, centerY, scale);
                    [ (i+7)%12, (i+4)%12, (i+3)%12 ].forEach(target => {
                        const pos2 = this.getCoords(target, centerX, centerY, scale);
                        this.ctx.beginPath();
                        this.ctx.moveTo(pos1.x, pos1.y);
                        this.ctx.lineTo(pos2.x, pos2.y);
                        this.ctx.stroke();
                    });
                }

                // Ruta Sugerida
                if (suggestion && suggestion.mask > 0) {
                    this.ctx.beginPath();
                    let first = true;
                    for (let i = 0; i < 12; i++) {
                        if ((suggestion.mask & (1 << i)) !== 0) {
                            const pos = this.getCoords(i, centerX, centerY, scale);
                            if (first) { this.ctx.moveTo(pos.x, pos.y); first = false; } 
                            else { this.ctx.lineTo(pos.x, pos.y); }
                        }
                    }
                    this.ctx.closePath();
                    this.ctx.setLineDash([5, 10]);
                    this.ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }

                // Acorde Actual
                if (active_mask > 0) {
                    this.ctx.beginPath();
                    let firstNode = true;
                    for (let i = 0; i < 12; i++) {
                        if ((active_mask & (1 << i)) !== 0) {
                            const pos = this.getCoords(i, centerX, centerY, scale);
                            if (firstNode) { this.ctx.moveTo(pos.x, pos.y); firstNode = false; } 
                            else { this.ctx.lineTo(pos.x, pos.y); }
                        }
                    }
                    this.ctx.closePath();
                    this.ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.9)`;
                    this.ctx.lineWidth = 4;
                    this.ctx.stroke();
                    this.ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.2)`;
                    this.ctx.fill();
                }

                // Nodos
                for (let i = 0; i < 12; i++) {
                    const pos = this.getCoords(i, centerX, centerY, scale);
                    const isActive = (active_mask & (1 << i)) !== 0;
                    const isSuggested = suggestion && ((suggestion.mask & (1 << i)) !== 0) && !isActive;

                    this.ctx.beginPath();
                    this.ctx.arc(pos.x, pos.y, isActive ? 24 : (isSuggested ? 16 : 10), 0, Math.PI * 2);
                    
                    if (isActive) {
                        this.ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
                        this.ctx.shadowBlur = 25;
                        this.ctx.shadowColor = this.ctx.fillStyle;
                    } else if (isSuggested) {
                        this.ctx.fillStyle = `rgba(255, 255, 255, 0.25)`;
                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = 'white';
                    } else {
                        this.ctx.fillStyle = '#111';
                        this.ctx.shadowBlur = 0;
                    }
                    this.ctx.fill();
                    this.ctx.lineWidth = isSuggested ? 2 : 1;
                    this.ctx.strokeStyle = isSuggested ? 'rgba(255,255,255,0.6)' : '#333';
                    this.ctx.stroke();

                    this.ctx.fillStyle = isActive ? '#000' : (isSuggested ? '#fff' : '#444');
                    this.ctx.font = isActive ? 'bold 16px monospace' : '12px monospace';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.shadowBlur = 0;
                    this.ctx.fillText(noteNames[i], pos.x, pos.y);
                }
            }
        }

        // ==========================================
        // 7. INICIALIZACIÓN
        // ==========================================
        const stateManager = new StateManager(INITIAL_MATRIX);
        const renderer = new VisualRenderer('harmonyCanvas', stateManager);
        const audioSentry = new AudioSentry(stateManager);
        
        const debugPanel = document.getElementById('debug-panel');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        stateManager.subscribe((state) => {
            const sugText = state.suggestion ? `<span style="color: #fff">Ruta Sugerida: ${state.suggestion.name}</span>` : 'Ninguna';
            const historyText = state.history && state.history.length > 0 
                ? state.history.map(h => h.name).join(' ➔ ') 
                : 'Esperando acordes...';

            debugPanel.innerHTML = `
                <strong style="color: #0f0;">MODULUS: RED TONNETZ</strong><br><br>
                Nodos: [${state.notes_array.join(', ')}]<br>
                Tensión: ${state.tension_level.toFixed(1)}<br>
                Estado: <span style="color: rgb(${state.color.r},${state.color.g},${state.color.b})">${state.description}</span><br><br>
                ${sugText}
                <div class="history-track">
                    <strong>Historial Sesión:</strong><br>
                    ${historyText}
                </div>
            `;
        });

        startBtn.addEventListener('click', async () => {
            startBtn.textContent = "Conectando FFT...";
            startBtn.disabled = true;
            await audioSentry.initialize();
            overlay.style.display = 'none';
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('Modulus SW: Registrado', registration.scope))
                .catch(error => console.error('Modulus SW: Fallo', error));
            });
        }
    </script>
</body>
</html>
