<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modulo12</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050508">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --bg-color: #050508; --accent: #00ff00; --accent-hover: #00cc00; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: monospace; user-select: none; color: #fff;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #debug-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(5, 5, 8, 0.9); padding: 15px;
            border-radius: 8px; pointer-events: none; border: 1px solid #222;
            z-index: 10; min-width: 250px; backdrop-filter: blur(4px);
        }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.98); display: flex; justify-content: center;
            align-items: center; z-index: 20; flex-direction: column;
        }
        
        button {
            background-color: var(--accent); color: #000; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); transition: all 0.2s ease;
            font-family: monospace; letter-spacing: 1px;
        }
        button:hover { background-color: var(--accent-hover); transform: scale(1.02); }
        button:disabled { background-color: #333; box-shadow: none; cursor: not-allowed; color: #777; }
        
        .menu-action-btn {
            padding: 12px; font-size: 14px; width: 100%; margin-bottom: 12px;
            text-align: center; box-shadow: none; letter-spacing: 0;
        }
        .btn-pause { background-color: var(--accent); color: #000; }
        .btn-stop { background-color: #ff3333; color: #fff; }
        .btn-stop:hover { background-color: #cc0000; }
        .btn-clear { background-color: transparent; color: #ff3333; border: 1px solid #ff3333; }
        .btn-clear:hover { background-color: rgba(255,51,51,0.1); }

        .history-track {
            color: #888; font-size: 11px; margin-top: 12px;
            border-top: 1px solid #333; padding-top: 12px; line-height: 1.6;
        }

        #menu-btn {
            position: absolute; top: 20px; right: 20px; z-index: 30;
            font-size: 28px; color: #fff; cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.8); padding: 5px;
        }
        #sidebar {
            position: fixed; top: 0; right: -300px; width: 260px; height: 100%;
            background: rgba(10, 10, 12, 0.98); border-left: 1px solid #222;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40; padding: 25px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8); box-sizing: border-box;
        }
        #sidebar.active { right: 0; }
        #close-btn {
            font-size: 32px; cursor: pointer; text-align: right; 
            margin-bottom: 20px; color: #666; line-height: 1;
        }
        #close-btn:hover { color: #fff; }

        /* Controles de Configuración */
        .config-group {
            margin-top: 30px; border-top: 1px solid #222; padding-top: 20px;
        }
        .config-label {
            font-size: 12px; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between;
        }
        input[type=range] {
            width: 100%; -webkit-appearance: none; background: transparent; margin: 10px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%; background: var(--accent);
            cursor: pointer; -webkit-appearance: none; margin-top: -6px;
        }
    </style>
</head>
<body>

    <div id="menu-btn">☰</div>
    <div id="sidebar">
        <div id="close-btn">×</div>
        <h3 style="color: var(--accent); margin-top: 0; letter-spacing: 1px; font-size: 20px;">Modulo12</h3>
        <hr style="border-color: #222; margin-bottom: 25px;">
        
        <button id="pause-btn" class="menu-action-btn btn-pause">Pausar Detección</button>
        <button id="stop-btn" class="menu-action-btn btn-stop">Detener Hardware</button>
        <button id="clear-btn" class="menu-action-btn btn-clear">Purgar Memoria</button>
        
        <div class="config-group">
            <div class="config-label">
                <span>Sensibilidad</span>
                <span id="sens-val">75%</span>
            </div>
            <input type="range" id="sens-slider" min="1" max="100" value="75">
            <div style="color: #555; font-size: 10px; line-height: 1.4; margin-top: 8px;">
                Disminuye para filtrar ruido de fondo (lluvia/viento). Aumenta para captar armónicos sutiles.
            </div>
        </div>
        
        <div style="color: #555; font-size: 12px; margin-top: 30px;">
            <div>▶ Selector de Escalas (Próx.)</div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="margin-bottom: 40px; color: var(--accent); letter-spacing: 4px; font-size: 2.5rem; text-shadow: 0 0 20px rgba(0,255,0,0.3);">Modulo12</h1>
        <button id="start-btn">INICIAR MOTOR</button>
    </div>

    <div id="debug-panel">Cargando dependencias matemáticas...</div>
    <canvas id="harmonyCanvas"></canvas>

    <script>
        'use strict';

        // ==========================================
        // 1. MOTOR MATEMÁTICO Y DICCIONARIO
        // ==========================================
        const noteNames = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const createMask = (notes) => notes.reduce((m, n) => m | (1 << n), 0);
        
        const Z12_DICTIONARY = Array.from({length: 12}).flatMap((_, i) => [
            { name: `${noteNames[i]} May`, mask: createMask([i, (i+4)%12, (i+7)%12]) },
            { name: `${noteNames[i]} min`, mask: createMask([i, (i+3)%12, (i+7)%12]) },
            { name: `${noteNames[i]}Maj7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+11)%12]) },
            { name: `${noteNames[i]}min7`, mask: createMask([i, (i+3)%12, (i+7)%12, (i+10)%12]) },
            { name: `${noteNames[i]}7`, mask: createMask([i, (i+4)%12, (i+7)%12, (i+10)%12]) },
            { name: `${noteNames[i]}dim7`, mask: createMask([i, (i+3)%12, (i+6)%12, (i+9)%12]) }
        ]);

        const HarmonyEngine = {
            createPitchClassSet: createMask,
            calculateParsimony: (maskA, maskB) => {
                let count = 0;
                for (let intersection = maskA & maskB; intersection > 0; intersection >>= 1) {
                    count += intersection & 1;
                }
                return count;
            },
            evaluateTension: (notes) => {
                if (notes.length < 2) return { level: 0.0, color: {r: 0, g: 255, b: 0}, desc: "Reposo absoluto" };
                let hasTritone = false, hasMinorSecond = false;
                for (let i = 0; i < notes.length; i++) {
                    for (let j = i + 1; j < notes.length; j++) {
                        let interval = Math.abs(notes[i] - notes[j]) % 12;
                        if (interval === 6) hasTritone = true;
                        if (interval === 1 || interval === 11) hasMinorSecond = true;
                    }
                }
                if (hasTritone) return { level: 1.0, color: {r: 255, g: 0, b: 0}, desc: "Máxima inestabilidad (Tritono)" };
                if (hasMinorSecond) return { level: 0.7, color: {r: 255, g: 165, b: 0}, desc: "Tensión armónica" };
                return { level: 0.3, color: {r: 0, g: 200, b: 255}, desc: "Estabilidad matizada" };
            },
            suggestPath: (currentMask) => {
                if(currentMask === 0) return null;
                let best = null, maxShared = 0;
                for(const chord of Z12_DICTIONARY) {
                    if(chord.mask === currentMask) continue; 
                    let shared = HarmonyEngine.calculateParsimony(currentMask, chord.mask);
                    if(shared > maxShared) { maxShared = shared; best = chord; }
                }
                return maxShared > 0 ? best : null;
            }
        };

        // ==========================================
        // 2. GESTIÓN DE ESTADO LOCAL-FIRST
        // ==========================================
        class StateManager {
            constructor() {
                const initial = {
                    active_mask: 0, notes_array: [], notes_detail: [], 
                    tension_level: 0.0, color: {r: 34, g: 34, b: 34},
                    description: "Silencio", suggestion: null, history: [],
                    status: "standby", sensitivity: 75
                };
                
                const saved = localStorage.getItem('modulus_state_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    this.state = { 
                        ...initial, 
                        history: parsed.history || [], 
                        sensitivity: parsed.sensitivity !== undefined ? parsed.sensitivity : 75 
                    };
                } else {
                    this.state = initial;
                }
                this.listeners = [];
            }
            
            update(newState) {
                const prevMask = this.state.active_mask;
                this.state = { ...this.state, ...newState };

                if (newState.active_mask !== undefined && newState.active_mask !== prevMask) {
                    if (this.state.status === 'active' && this.state.active_mask > 0) {
                        const chordDef = Z12_DICTIONARY.find(c => c.mask === this.state.active_mask);
                        const name = chordDef ? chordDef.name : `[${this.state.notes_detail.map(n=>n.name).join(',')}]`;
                        
                        const hist = this.state.history;
                        if (hist.length === 0 || hist[hist.length - 1].mask !== this.state.active_mask) {
                            hist.push({ mask: this.state.active_mask, name });
                            if (hist.length > 8) hist.shift();
                        }
                    }
                }
                
                localStorage.setItem('modulus_state_v2', JSON.stringify({ 
                    history: this.state.history,
                    sensitivity: this.state.sensitivity
                }));
                this.notify();
            }

            clearHistory() {
                this.state.history = [];
                localStorage.setItem('modulus_state_v2', JSON.stringify({ 
                    history: [], sensitivity: this.state.sensitivity 
                }));
                this.notify();
            }

            subscribe(cb) { this.listeners.push(cb); this.notify(); }
            notify() {
                const snap = JSON.parse(JSON.stringify(this.state));
                this.listeners.forEach(cb => cb(snap));
            }
        }

        // ==========================================
        // 3. MÓDULO DE PERCEPCIÓN ACÚSTICA (CON UMBRAL DE RUIDO)
        // ==========================================
        class AudioEngine {
            constructor(stateManager) {
                this.stateManager = stateManager;
                this.audioCtx = null; this.analyser = null;
                this.dataArray = null; this.stream = null;
                this.animationId = null;
            }

            async start() {
                try {
                    const constraints = {
                        audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, channelCount: 1 }
                    };
                    
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    await this.audioCtx.resume();

                    const source = this.audioCtx.createMediaStreamSource(this.stream);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 8192;
                    this.analyser.smoothingTimeConstant = 0.6;
                    
                    source.connect(this.analyser);
                    this.dataArray = new Float32Array(this.analyser.frequencyBinCount);
                    
                    this.stateManager.update({ status: 'active' });
                    this.processFrame();
                    return true;
                } catch (err) {
                    console.error("Audio error:", err);
                    alert("No se pudo acceder al hardware de audio crudo.");
                    return false;
                }
            }

            processFrame() {
                if (this.stateManager.state.status !== 'active') return;
                
                this.analyser.getFloatFrequencyData(this.dataArray);
                const details = this.extractPitchesDynamic();
                const rawPitches = details.map(d => d.pitch);
                const mask = HarmonyEngine.createPitchClassSet(rawPitches);
                
                const tension = HarmonyEngine.evaluateTension(rawPitches);
                const path = HarmonyEngine.suggestPath(mask);

                this.stateManager.update({
                    active_mask: mask, notes_array: rawPitches, notes_detail: details,
                    tension_level: tension.level, color: tension.color, 
                    description: tension.desc, suggestion: path
                });

                this.animationId = requestAnimationFrame(() => this.processFrame());
            }

            extractPitchesDynamic() {
                const binCount = this.analyser.frequencyBinCount;
                const sampleRate = this.audioCtx.sampleRate;
                
                let maxAmp = -Infinity;
                for (let i = 0; i < binCount; i++) {
                    if (this.dataArray[i] > maxAmp) maxAmp = this.dataArray[i];
                }

                // Cálculo de Piso de Ruido (Noise Floor) basado en Sensibilidad [1 a 100]
                // 100 = -90dB (Hipersensible, capta todo). 1 = -30dB (Sordo, requiere sonido fuerte/cercano).
                const sens = this.stateManager.state.sensitivity;
                const noiseFloor = -30 - (sens * 0.6); 

                if (maxAmp < noiseFloor) return [];

                const dynamicThreshold = maxAmp - 30; // Solo nodos a menos de 30dB del pico dominante
                let detected = [];

                for (let i = 2; i < binCount - 2; i++) {
                    const amp = this.dataArray[i];
                    if (amp > noiseFloor && amp > dynamicThreshold && amp > this.dataArray[i-1] && amp > this.dataArray[i+1]) {
                        const freq = i * (sampleRate / (binCount * 2));
                        if (freq < 50 || freq > 3000) continue; 
                        
                        const midi = Math.round(12 * Math.log2(freq / 440) + 69);
                        const pitch = ((midi % 12) + 12) % 12;
                        const oct = Math.floor(midi / 12) - 1;
                        
                        detected.push({ pitch, octave: oct, midi, amp, name: `${noteNames[pitch]}${oct}` });
                    }
                }

                const map = new Map();
                for (const d of detected) {
                    if (!map.has(d.pitch) || d.midi < map.get(d.pitch).midi) {
                        map.set(d.pitch, d);
                    }
                }
                
                return Array.from(map.values()).sort((a, b) => a.midi - b.midi);
            }

            async setPause(pause) {
                if (!this.audioCtx) return;
                if (pause) {
                    await this.audioCtx.suspend();
                    if(this.animationId) cancelAnimationFrame(this.animationId);
                    this.stateManager.update({ status: 'paused' });
                } else {
                    await this.audioCtx.resume();
                    this.stateManager.update({ status: 'active' });
                    this.processFrame();
                }
            }

            stop() {
                if (this.animationId) cancelAnimationFrame(this.animationId);
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.audioCtx) this.audioCtx.close();
                this.stateManager.update({ 
                    status: 'standby', active_mask: 0, notes_array: [], notes_detail: [],
                    tension_level: 0, color: {r:34,g:34,b:34}, description: "Hardware desconectado", suggestion: null
                });
            }
        }

        // ==========================================
        // 4. PROYECTOR VISUAL (HIGH-DPI SISTEMA SOLAR)
        // ==========================================
        class Renderer {
            constructor(canvasId, stateManager) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                stateManager.subscribe(s => this.draw(s));
                window.addEventListener('resize', () => this.resize(stateManager.state));
                this.resize(stateManager.state);
            }

            resize(state) {
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * dpr;
                this.canvas.height = window.innerHeight * dpr;
                this.canvas.style.width = `${window.innerWidth}px`;
                this.canvas.style.height = `${window.innerHeight}px`;
                this.ctx.scale(dpr, dpr);
                this.draw(state);
            }

            drawNode(n, x, y, size, col, isDark, blur, stroke) {
                this.ctx.beginPath(); this.ctx.arc(x, y, size, 0, Math.PI * 2);
                this.ctx.fillStyle = col; this.ctx.shadowBlur = blur; this.ctx.shadowColor = col; this.ctx.fill();
                this.ctx.lineWidth = 2; this.ctx.strokeStyle = stroke; this.ctx.stroke();
                this.ctx.fillStyle = isDark ? '#000' : '#fff';
                this.ctx.font = `bold ${size * 0.55}px monospace`; 
                this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                this.ctx.shadowBlur = 0; this.ctx.fillText(n, x, y);
            }

            draw(state) {
                const w = window.innerWidth, h = window.innerHeight;
                this.ctx.clearRect(0, 0, w, h);
                
                const { active_mask, notes_detail, color, suggestion } = state;
                const cx = w / 2, cy = h / 2;
                const dim = Math.min(w, h);
                
                const r1 = dim * 0.18, r2 = dim * 0.32, r3 = dim * 0.42;

                const drawRing = (r, dash, op) => {
                    this.ctx.beginPath(); this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    this.ctx.strokeStyle = `rgba(255,255,255,${op})`; this.ctx.lineWidth = 1;
                    if(dash) this.ctx.setLineDash([4, 8]);
                    this.ctx.stroke(); this.ctx.setLineDash([]);
                };

                drawRing(r1, false, 0.1); drawRing(r2, true, 0.15); drawRing(r3, false, 0.05);

                const rgb = `rgb(${color.r},${color.g},${color.b})`;

                if (active_mask === 0 || notes_detail.length === 0) {
                    for(let i=0; i<12; i++) {
                        const a = (i * Math.PI*2)/12 - Math.PI/2;
                        this.drawNode(noteNames[i], cx+Math.cos(a)*r3, cy+Math.sin(a)*r3, 14, '#0a0a0c', false, 0, '#222');
                    }
                    return;
                }

                const root = notes_detail[0];
                this.drawNode(root.name, cx, cy, 40, rgb, true, 30, '#fff');

                const planets = [], moons = [], space = [];
                for(let i=0; i<12; i++) {
                    if (i === root.pitch) continue;
                    if ((active_mask & (1<<i))) {
                        const d = notes_detail.find(n => n.pitch === i);
                        planets.push(d ? d : {pitch: i, name: noteNames[i]});
                    } else if (suggestion && (suggestion.mask & (1<<i))) {
                        moons.push({pitch: i, name: noteNames[i]});
                    } else {
                        space.push({pitch: i, name: noteNames[i]});
                    }
                }

                const dist = (arr, r, size, col, dark, blur, stroke, link) => {
                    const cnt = arr.length;
                    arr.forEach((n, i) => {
                        const a = (i * Math.PI*2)/cnt - Math.PI/2;
                        const nx = cx+Math.cos(a)*r, ny = cy+Math.sin(a)*r;
                        if(link) {
                            this.ctx.beginPath(); this.ctx.moveTo(cx, cy); this.ctx.lineTo(nx, ny);
                            this.ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},0.4)`; 
                            this.ctx.lineWidth = 2; this.ctx.stroke();
                        }
                        this.drawNode(n.name, nx, ny, size, col, dark, blur, stroke);
                    });
                };

                dist(planets, r1, 26, rgb, true, 15, '#fff', true);
                dist(moons, r2, 18, 'rgba(255,255,255,0.1)', false, 0, '#666', false);
                dist(space, r3, 12, '#0a0a0c', false, 0, '#222', false);
            }
        }

        // ==========================================
        // 5. INICIALIZACIÓN E INTERFACES
        // ==========================================
        const stateManager = new StateManager();
        const audioEngine = new AudioEngine(stateManager);
        const renderer = new Renderer('harmonyCanvas', stateManager);
        
        const ui = {
            panel: document.getElementById('debug-panel'), overlay: document.getElementById('overlay'),
            start: document.getElementById('start-btn'), menu: document.getElementById('menu-btn'),
            close: document.getElementById('close-btn'), sidebar: document.getElementById('sidebar'),
            pause: document.getElementById('pause-btn'), stop: document.getElementById('stop-btn'),
            clear: document.getElementById('clear-btn'),
            sensSlider: document.getElementById('sens-slider'), sensVal: document.getElementById('sens-val')
        };

        // Binding de Configuración de Sensibilidad
        ui.sensSlider.value = stateManager.state.sensitivity;
        ui.sensVal.textContent = stateManager.state.sensitivity + '%';

        ui.sensSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            ui.sensVal.textContent = val + '%';
            stateManager.update({ sensitivity: val });
        });

        ui.menu.onclick = () => ui.sidebar.classList.add('active');
        ui.close.onclick = () => ui.sidebar.classList.remove('active');

        ui.pause.onclick = async () => {
            const isPaused = stateManager.state.status === 'paused';
            await audioEngine.setPause(!isPaused);
            ui.pause.textContent = isPaused ? "Pausar Detección" : "Reanudar Escucha";
            ui.pause.style.backgroundColor = isPaused ? "var(--accent)" : "#ffaa00";
            ui.sidebar.classList.remove('active');
        };

        ui.stop.onclick = () => {
            audioEngine.stop();
            ui.pause.textContent = "Pausar Detección"; ui.pause.style.backgroundColor = "var(--accent)";
            ui.sidebar.classList.remove('active');
            ui.overlay.style.display = 'flex';
        };

        ui.clear.onclick = () => {
            stateManager.clearHistory();
            ui.sidebar.classList.remove('active');
        };

        stateManager.subscribe(s => {
            const hist = s.history.length ? s.history.map(h => h.name).join(' ➔ ') : 'Memoria vacía';
            const notes = s.notes_detail.map(n => n.name).join(', ') || '[]';
            const sug = s.suggestion ? `<span style="color: #fff">${s.suggestion.name}</span>` : 'Ninguna';
            const statColor = s.status === 'active' ? '#0f0' : (s.status === 'paused' ? '#fa0' : '#888');

            ui.panel.innerHTML = `
                <div style="color: ${statColor}; font-weight: bold; font-size: 14px; margin-bottom: 10px;">
                    ESTADO: ${s.status.toUpperCase()}
                </div>
                Nodos: ${notes}<br>
                Tensión: ${s.tension_level.toFixed(2)}<br>
                Color: <span style="color: rgb(${s.color.r},${s.color.g},${s.color.b})">${s.description}</span><br>
                Path: ${sug}
                <div class="history-track">
                    <strong>Matriz Histórica:</strong><br>${hist}
                </div>
            `;
        });

        ui.start.onclick = async () => {
            ui.start.textContent = "CONECTANDO DSP...";
            ui.start.disabled = true;
            if (await audioEngine.start()) {
                ui.overlay.style.display = 'none';
            }
            ui.start.textContent = "INICIAR MOTOR";
            ui.start.disabled = false;
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
