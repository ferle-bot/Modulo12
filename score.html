<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModuloScore - Lector de Partituras Z12</title>
    
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">

    <style>
        :root { --bg-color: #050508; --accent: #00ffcc; --panel: #0a0a0e; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); color: #fff; font-family: monospace; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; border: 1px solid #0a0a0e; }
        
        #header { background: rgba(10, 10, 15, 0.95); border-bottom: 1px solid #222; padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .title { color: var(--accent); margin: 0; letter-spacing: 2px; font-size: 24px; }
        
        .upload-btn { background-color: #111; color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; transition: all 0.2s; }
        .upload-btn:hover { background-color: var(--accent); color: #000; }
        input[type="file"] { display: none; }

        #main-container { display: flex; height: calc(100vh - 80px); }
        
        #data-panel { width: 320px; background: var(--panel); border-right: 1px solid #222; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        
        .db-session-btn { background: #111; border: 1px solid #333; color: #fff; width: 100%; text-align: left; padding: 12px; margin-bottom: 10px; cursor: pointer; font-family: monospace; font-size: 12px; border-radius: 4px; transition: border-color 0.2s; }
        .db-session-btn:hover { border-color: var(--accent); }
        
        #score-panel { flex: 1; padding: 40px; overflow-y: auto; background: #e8e8e8; display: flex; flex-direction: column; align-items: center; }

        .abc-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 900px; color: #000; margin-bottom: 20px; overflow-x: auto; }
        .meta-info { color: #888; font-size: 12px; margin-bottom: 15px; line-height: 1.8; }
        .meta-value { color: var(--accent); font-weight: bold; }
        .abcjs-inline-audio { max-width: 900px; width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="header">
        <h1 class="title">ModuloScore</h1>
        <div style="display:flex; gap:10px;">
            <button class="upload-btn" onclick="loadFromDB()">⟳ Refrescar DB Local</button>
            <label class="upload-btn" style="border-color:#555; color:#aaa;">
                Importar JSON Físico
                <input type="file" id="json-upload" accept=".json">
            </label>
        </div>
    </div>

    <div id="main-container">
        <div id="data-panel">
            <h3 style="color: var(--accent); margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;">Tubería de Datos DB</h3>
            <div id="db-list" style="margin-bottom: 30px; color: #666; font-size: 12px;">Consultando base de datos...</div>
            
            <h3 style="color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px;">Traductor RAW (ABC)</h3>
            <pre id="abc-raw" style="color: #888; font-size: 11px; white-space: pre-wrap; word-wrap: break-word;"></pre>
        </div>

        <div id="score-panel">
            <div id="audio-synth"></div>
            <div id="sheet-music" class="abc-container">
                <div style="text-align: center; color: #888; margin-top: 50px;">
                    Selecciona una sesión de la base de datos lateral para renderizar el pentagrama.
                </div>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        // ==========================================
        // 1. CONEXIÓN A LA TUBERÍA DE DATOS (ModuloDB)
        // ==========================================
        const ModuloDB = {
            init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('ModuloDB', 1);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('z12_sessions')) {
                            db.createObjectStore('z12_sessions', { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async getAllSessions() {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('z12_sessions', 'readonly');
                    const req = tx.objectStore('z12_sessions').getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
        };

        async function loadFromDB() {
            const listDiv = document.getElementById('db-list');
            try {
                const sessions = await ModuloDB.getAllSessions();
                if (sessions.length === 0) {
                    listDiv.innerHTML = "Base de datos vacía. Graba una matriz en Modulo12 primero.";
                    return;
                }
                
                listDiv.innerHTML = "";
                for(let i = sessions.length - 1; i >= 0; i--) {
                    const s = sessions[i];
                    const btn = document.createElement('button');
                    btn.className = 'db-session-btn';
                    btn.innerHTML = `<strong style="color:var(--accent)">${s.date}</strong><br>Perfil: ${s.profile}<br>Nodos: ${s.events ? s.events.length : 0}`;
                    btn.onclick = () => processSession(s);
                    listDiv.appendChild(btn);
                }
            } catch (err) {
                listDiv.innerHTML = "Error al conectar con IndexedDB.";
            }
        }

        window.onload = loadFromDB;

        // ==========================================
        // 2. MOTOR DE TRADUCCIÓN (Corrección Sintáctica ABC)
        // ==========================================
        const Translator = {
            midiToAbcNote: (midi, scaleContextStr) => {
                // Deducción de enarmonía basada en el contexto de la escala
                const isFlatContext = scaleContextStr && (scaleContextStr.includes("b") || scaleContextStr.includes("F Mayor"));
                
                // Corrección ABC: El bemol se escribe con '_' y el sostenido con '^'
                const notesSharps = ["C", "^C", "D", "^D", "E", "F", "^F", "G", "^G", "A", "^A", "B"];
                const notesFlats  = ["C", "_D", "D", "_E", "E", "F", "_G", "G", "_A", "A", "_B", "B"];
                
                const pitch = midi % 12;
                const octave = Math.floor(midi / 12) - 1;
                const noteStr = isFlatContext ? notesFlats[pitch] : notesSharps[pitch];

                // Reglas estrictas de octavación ABC
                if (octave === 4) return noteStr;                    
                if (octave === 5) return noteStr.toLowerCase();      
                if (octave === 6) return noteStr.toLowerCase() + "'"; 
                if (octave === 7) return noteStr.toLowerCase() + "''"; 
                if (octave === 3) return noteStr + ",";              
                if (octave === 2) return noteStr + ",,";             
                if (octave === 1) return noteStr + ",,,";            
                return noteStr; 
            },

            buildAbcString: (session) => {
                const scaleInfo = session.scale_context || "C Cromática";
                const events = session.events || [];
                
                let abcString = `X: 1\n`;
                abcString += `T: Registro Acústico - ${session.date}\n`;
                abcString += `C: Modulo12 | ${session.profile}\n`;
                abcString += `M: 4/4\n`;
                abcString += `L: 1/4\n`; 
                abcString += `Q: 1/4=100\n`; 
                
                // Si la escala es conocida, intentar aplicarla como armadura (Key Signature)
                // Por defecto, lo dejamos en C para evitar conflictos con alteraciones accidentales.
                abcString += `K: C\n`; 
                
                let measureCount = 0;
                let lineString = "";

                events.forEach((event) => {
                    if (!event.midi_notes || event.midi_notes.length === 0) return;
                    
                    // Ensamblar Acorde
                    const chordNotes = event.midi_notes.map(m => Translator.midiToAbcNote(m, scaleInfo)).join("");
                    lineString += `[${chordNotes}] `;
                    
                    measureCount++;
                    if (measureCount % 4 === 0) lineString += "| ";
                    if (measureCount % 16 === 0) lineString += "\n";
                });

                return abcString + lineString + "||";
            }
        };

        const abcRawDisplay = document.getElementById('abc-raw');
        const sheetMusicDiv = document.getElementById('sheet-music');

        function processSession(sessionData) {
            if (!sessionData.events || sessionData.events.length === 0) {
                alert("La sesión seleccionada no contiene matrices de eventos válidas.");
                return;
            }

            // 1. Traducir Matriz a ABC
            const abcText = Translator.buildAbcString(sessionData);
            abcRawDisplay.textContent = abcText;

            // 2. Renderizar Partitura (CORRECCIÓN: Objeto Global ABCJS en mayúsculas)
            sheetMusicDiv.innerHTML = ""; 
            try {
                const visualObj = ABCJS.renderAbc("sheet-music", abcText, {
                    responsive: "resize",
                    add_classes: true,
                    staffwidth: 800
                });

                // 3. Integrar Sintetizador Visual de Lector
                if (ABCJS.synth.supportsAudio()) {
                    const synthControl = new ABCJS.synth.SynthController();
                    synthControl.load("#audio-synth", null, {
                        displayRestart: true, displayPlay: true, displayProgress: true, displayWarp: true
                    });
                    synthControl.setTune(visualObj[0], false);
                }
            } catch (error) {
                sheetMusicDiv.innerHTML = `<div style="color:red; text-align:center;">Error al renderizar el pentagrama: ${error.message}</div>`;
            }
        }

        // ==========================================
        // 3. CARGA MANUAL DE EMERGENCIA
        // ==========================================
        document.getElementById('json-upload').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const session = data.session || data; 
                    if (data.session_events) session.events = data.session_events;
                    processSession(session);
                } catch (err) { alert("Error al leer el archivo JSON físico."); }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
